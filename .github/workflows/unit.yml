name: Unit Test

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Unit test and save results
        env:
          TEST_REPORT: true
        run: pnpm run test

      - name: Upload test results
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/test-report.junit.xml
          report_type: test_results

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
